name: reference.places
type: duckdb.seed
owner: jihyeonkim610
tags: ["transamerica-job", "reference"]
description: |
  The places on the map the crew can choose, with the key the game uses for police roadblocks
  and the name it writes in the decision log. The three exits are the only ways out of the city.
parameters:
  path: places.csv
columns:
  - name: place_key
    type: varchar
    description: Key the game uses for the place (also used for police roadblocks)
    primary_key: true
    checks:
      - name: not_null
      - name: unique
  - name: place_name
    type: varchar
    description: Name of the place as written in the decision log
    checks:
      - name: not_null
      - name: unique
  - name: area
    type: varchar
    description: Part of the map
    checks:
      - name: accepted_values
        value: ["south", "downtown", "north", "bay", "east", "exit"]
  - name: is_exit
    type: boolean
    description: True for the three ways out of the city
    checks:
      - name: not_null
custom_checks:
  - name: exactly three exits
    query: SELECT count(*) FROM reference.places WHERE is_exit
    value: 3
